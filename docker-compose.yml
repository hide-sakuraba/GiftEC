services:
  db:
    image: postgres:16-alpine
    container_name: gift_ec_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-giftec_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
