[project]
name = "gift-ec-site"
version = "0.1.0"
description = "Gift Shop Small EC Site with Django, PostgreSQL, Stripe, and uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "pillow>=10.0.0",
    "psycopg[binary]>=3.1.0",
    "stripe>=8.0.0",
    "python-dotenv>=1.0.0",
    "dj-database-url>=2.3.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["accounts", "carts", "config", "orders", "products"]

[tool.uv]
package = false
