{% extends 'base.html' %}
{% load static %}

{% block title %}会員登録 | GiftEC{% endblock %}

{% block content %}
  <div style="max-width: 480px; margin: 2rem auto;">
    <div class="cart-card">
      <h1 style="font-size: 1.8rem; text-align: center; margin-bottom: 1.5rem;">新規会員登録</h1>

      <form method="post" action="{% url 'accounts:register' %}">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">ユーザー名</label>
          {{ form.username }}
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">姓</label>
            {{ form.last_name }}
          </div>
          <div>
            <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">名</label>
            {{ form.first_name }}
          </div>
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">メールアドレス</label>
          {{ form.email }}
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">パスワード</label>
          <input type="password" name="password1" class="form-input" placeholder="パスワード" required>
        </div>
        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">パスワード (確認用)</label>
          <input type="password" name="password2" class="form-input" placeholder="パスワード確認" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1rem;">
          登録する
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        すでにアカウントをお持ちですか？ <a href="{% url 'accounts:login' %}" style="color: var(--primary-color); font-weight: 600;">ログイン</a>
      </div>
    </div>
  </div>
{% endblock %}
